<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-label="FraTo, Full-Stack Developer">
<style>@font-face{font-family:'GeistX';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'GeistMonoX';src:url(data:font/woff2;base64,) format('woff2');}</style>
<defs>
  <linearGradient id="name" x1="0" y1="0" x2="0" y2="1"><stop offset=".15" stop-color="#ffffff"/><stop offset="1" stop-color="#9ea7b3"/></linearGradient>
  <linearGradient id="top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c2330"/><stop offset="1" stop-color="#0f141b"/></linearGradient>
  <radialGradient id="halo"><stop offset="0" stop-color="#ffffff" stop-opacity=".45"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
  <clipPath id="reveal"><rect x="0" y="0" width="640" height="140"/></clipPath>
</defs>

<g clip-path="url(#reveal)">
  <text x="2" y="116" font-family="GeistX" font-size="92" letter-spacing="-3.2" fill="url(#name)">FraTo
    <animateTransform attributeName="transform" type="translate" values="0 92;0 0" dur="1.1s" begin="0s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".16 1 .3 1"/></text>
</g>

<g opacity="0">
  <animate attributeName="opacity" from="0" to="1" dur=".9s" begin=".55s" fill="freeze"/>
